    - role: .NET Developer
      time: October 2021 - Present
      company: Factory World Wide
      details: Throughout my involvement in numerous projects, from developing applications from scratch to implementing complex systems, I have gained extensive experience in software development. I began with the .NET Framework and later transitioned to .NET 8 and 9, which allowed me to become acquainted with contemporary technologies and industry practices. In system implementation, utilized <b>MSSQL</b> as the primary relational database storage I utilized <b>Redis</b> for data caching, significantly enhancing application performance. To enable efficient data retrieval, I integrated <b>Elasticsearch</b>, facilitating rapid and precise searches across large datasets. Employing <b>YARP</b> (Yet Another Reverse Proxy), I ensured secure and efficient request routing, alongside implementing authentication and authorization mechanisms. For automating background tasks, I employed <b>Hangfire</b>, enabling effective management of asynchronous processes. Building each project from the ground up has been instrumental in deepening my understanding of system architecture, performance optimization, and scalable application design. This hands-on approach has significantly enhanced my problem-solving abilities and proficiency in applying modern technologies, making me more efficient and independent in my work. 
      
